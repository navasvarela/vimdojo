name: LuaRocks release

# Publishes the plugin to luarocks.org (for rocks.nvim) when a version tag is
# pushed. On pull requests it only builds and installs the rock locally, which
# catches packaging mistakes before a release.
on:
  push:
    tags: ["v*"]
  pull_request:

# Read-only token; the upload authenticates with its own API key, which fork
# pull requests never receive.
permissions:
  contents: read

jobs:
  luarocks-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Pinned to v8: v9.0.0 always passes `upload --sign-protocol`, which
      # the lux version it installs (0.47.0) rejects, so every upload fails.
      # v8 uploads with plain luarocks. Revisit once v9 is fixed upstream.
      - uses: nvim-neorocks/luarocks-tag-release@2158fb00d5dc0e9cdbcde5f318719ff0f3b5c2df # v8.0.0
        env:
          # A luarocks.org API key, stored as the LUX_API_KEY repository
          # secret (v9's name for it), passed under the name v8 expects.
          LUAROCKS_API_KEY: ${{ secrets.LUX_API_KEY }}
        with:
          # challenges/ holds the level packs; the plugin finds it through
          # 'runtimepath' because a rock installs it apart from lua/.
          copy_directories: |
            {{ neovim.plugin.dirs }}
            challenges
          summary: Learn Vim motions by solving tiny puzzles in Neovim
          detailed_description: |
            A game that teaches Vim motions: each level gives you a snippet of
            text and a goal, and scores your solution on keystrokes, time and par.
          labels: |
            neovim
            vim
            game
            learning
