name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests run their own levels in CI (solution tests type keys into a
# real Neovim, and Setup levels run Lua), so a fork's PR is untrusted code.
# `pull_request` (never `pull_request_target`) gives forks no secrets; on top
# of that the token is read-only, checkouts don't keep it on disk, jobs have
# timeouts, and third-party actions are pinned to a commit so a moved tag
# can't change what runs.
permissions:
  contents: read

jobs:
  # Docs-only changes skip every job below: nothing here reads Markdown (docs.yml
  # lints it). docs/brand/ feeds the site and doc/ is the plugin's help, so those
  # still run, and a change that also touches code runs everything.
  #
  # This isn't `paths-ignore` because a workflow skipped that way reports no checks
  # at all, and a required check that never reports blocks the PR forever. A skipped
  # job does report, and counts as passing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      levels: ${{ steps.diff.outputs.levels }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # Anything unexpected runs everything: an empty diff, or a base that a
          # force-push has removed. Wrongly running costs minutes; wrongly skipping
          # would let untested code merge.
          if ! changed=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "code=true" >>"$GITHUB_OUTPUT"
            echo "levels=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qvE '\.md$|^docs/proposals/' <<<"$changed"; then
            echo "code=true" >>"$GITHUB_OUTPUT"
          else
            echo "code=false" >>"$GITHUB_OUTPUT"
          fi
          if grep -qE '^challenges/' <<<"$changed"; then
            echo "levels=true" >>"$GITHUB_OUTPUT"
          else
            echo "levels=false" >>"$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: JohnnyMorganz/stylua-action@479972f01e665acfcba96ada452c36608bdbbb5e # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --check .
      - uses: NTBBloodbath/selene-action@23ef05dd5c4d687f4d3c939f76a1c342baf454aa # v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.32.0
          args: lua plugin tests

  challenges:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: make validate

  plugin-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nightly warns of what's coming, but its breakage isn't this PR's fault, so a
    # failure there shows on the PR without failing the job for ci-passed.
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        # v0.10.4: the oldest supported release (D4 in PLAN-v2).
        neovim: [v0.10.4, stable, nightly]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - run: make doc
      - run: make test

  # Exercises the clean room on Windows: named pipes for RPC and ConPTY
  # terminals behave differently there.
  plugin-tests-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: stable
      - run: git clone --depth 1 https://github.com/nvim-lua/plenary.nvim .deps/plenary.nvim
      - run: >
          nvim --headless --noplugin -u tests/minimal_init.lua
          -c "PlenaryBustedDirectory tests/ { minimal_init = 'tests/minimal_init.lua', sequential = true, timeout = 600000 }"
        env:
          PLENARY_DIR: ${{ github.workspace }}/.deps/plenary.nvim

  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Biome: lint and format check for the web code, level packs and shared
      # fixtures (biome.json is at the repo root).
      - run: npm run lint
      # Chromium runs the emulation tests that gate web_demo levels.
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The leaderboard verifier (PLAN-v3): replays every Motions and Usage
  # reference solution through its harness and runs its adversarial tests.
  verifier:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            verifier/package-lock.json
      # The verifier imports the rules (goals, keys, level schema) from web/src.
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: verifier
      - run: npm run typecheck
        working-directory: verifier
      - run: npm test
        working-directory: verifier

  # The leaderboard API, tested on a real local D1. It doesn't deploy:
  # that needs the maintainer's Cloudflare login (api/README.md).
  api:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # What a pull request does to the levels, for the reviewer: boards that start over,
  # par beside the par search, and fields that run code on players' machines. It's in
  # the job summary; level-report.yml, which may write to the PR, posts it as a
  # comment and labels the PR. Information only, so ci-passed doesn't wait on it.
  level-report:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.levels == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: stable
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/base" level-report
          git archive "$BASE" challenges | tar -x -C "$RUNNER_TEMP/base"
          nvim --headless --noplugin -u NONE -l scripts/level_report.lua \
            "$RUNNER_TEMP/base/challenges" level-report
          cat level-report/report.md >>"$GITHUB_STEP_SUMMARY"
          echo "$PR" >level-report/pr
          echo "$HEAD" >level-report/head
      - uses: actions/upload-artifact@v4
        with:
          name: level-report
          path: level-report/
          retention-days: 7

  workflows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Downloads a checksum-pinned actionlint; it also runs shellcheck (on
      # the runner image) over every run: block.
      - run: scripts/actionlint.sh

  # The one check the main ruleset requires, so adding or renaming a job needs no
  # ruleset change. `always()` is load-bearing: without it this job is skipped when a
  # job it needs fails, and a skipped required check counts as passing.
  ci-passed:
    needs: [changes, lint, challenges, plugin-tests, plugin-tests-windows, web, verifier, api, workflows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
