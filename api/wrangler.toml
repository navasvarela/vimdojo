# M15 spike: proves the Worker can drive a Vercel Sandbox verification batch.
# Local only for now (`npx wrangler dev`); secrets go in .dev.vars.
name = "vimdojo-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# The Vercel Sandbox SDK is written for Node; nodejs_compat is what may let it
# run on workerd. Finding out is the point of the spike.
compatibility_flags = ["nodejs_compat"]
